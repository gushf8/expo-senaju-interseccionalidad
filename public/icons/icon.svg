<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />
  
  <!-- Neural / Cluster Nodes -->
  <g filter="url(#glow)">
    <circle cx="160" cy="180" r="28" fill="#38bdf8" />
    <circle cx="352" cy="180" r="28" fill="#ec4899" />
    <circle cx="256" cy="330" r="34" fill="#818cf8" />
    <circle cx="256" cy="230" r="22" fill="#a855f7" />
  </g>

  <!-- Connection Edges -->
  <line x1="160" y1="180" x2="352" y2="180" stroke="url(#accent)" stroke-width="8" stroke-dasharray="6 6" />
  <line x1="160" y1="180" x2="256" y2="330" stroke="url(#accent)" stroke-width="8" />
  <line x1="352" y1="180" x2="256" y2="330" stroke="url(#accent)" stroke-width="8" />
  <line x1="256" y1="230" x2="256" y2="330" stroke="#38bdf8" stroke-width="6" />

  <!-- Center Icon Shape: Intersection & Diamond -->
  <polygon points="256,120 300,180 256,240 212,180" fill="none" stroke="#ffffff" stroke-width="6" />
  
  <!-- Badge text / mark -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SENAJU • ML</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">INVESTIGACIÓN 2026</text>
</svg>
